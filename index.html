<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eaf5f5">
    <title>Us</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #294b50;
            --muted: #638186;
            --paper: #fffefd;
            --line: #d5e7e7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 28px 18px;
            color: var(--ink);
            background-color: #eaf5f5;
            background-image:
                radial-gradient(ellipse at 12% 14%, rgba(255, 255, 255, 0.9), transparent 42%),
                radial-gradient(ellipse at 90% 88%, rgba(199, 226, 229, 0.75), transparent 38%);
            font-family: Georgia, 'Times New Roman', serif;
        }

        main {
            width: min(100%, 620px);
            text-align: center;
        }

        .opening {
            animation: arrive 700ms ease-out both;
        }

        .envelope {
            position: relative;
            display: block;
            width: min(100%, 420px);
            height: clamp(200px, 55vw, 260px);
            margin: 0 auto;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
            perspective: 1000px;
            transition: opacity 400ms ease 300ms, transform 400ms ease 300ms;
        }

        .envelope:focus-visible {
            outline: 3px solid var(--muted);
            outline-offset: 7px;
        }

        .envelope-back,
        .envelope-paper,
        .envelope-front,
        .envelope-flap {
            position: absolute;
            inset: 0;
        }

        .envelope-back {
            border: 1px solid #9fc4c8;
            background: #c7e2e5;
            box-shadow: 0 22px 50px rgba(48, 91, 96, 0.16);
        }

        .envelope-paper {
            z-index: 1;
            inset: 12% 9%;
            display: grid;
            place-items: start center;
            padding: 20px;
            color: var(--muted);
            background: var(--paper);
            font-size: 20px;
            transition: transform 650ms ease;
        }

        .envelope-front {
            z-index: 3;
            background: #d9edef;
            clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
        }

        .envelope-flap {
            z-index: 4;
            background: #b8d9dd;
            clip-path: polygon(0 0, 100% 0, 50% 61%);
            transform-origin: top;
            transition: transform 650ms ease;
        }

        .envelope-label {
            position: absolute;
            z-index: 5;
            right: 0;
            bottom: 20px;
            left: 0;
            color: var(--ink);
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 16px;
        }

        .opening.is-opening .envelope {
            opacity: 0;
            transform: translateY(24px) scale(0.97);
            pointer-events: none;
        }

        .opening.is-opening .envelope-flap {
            z-index: 1;
            transform: rotateX(180deg);
        }

        .opening.is-opening .envelope-front {
            z-index: 2;
        }

        .opening.is-opening .envelope-paper {
            z-index: 3;
            transform: translateY(-30px);
        }

        .letter {
            padding: clamp(22px, 5vw, 42px);
            background: var(--paper);
            border: 1px solid rgba(153, 190, 192, 0.55);
            box-shadow: 0 22px 60px rgba(48, 91, 96, 0.12);
            animation: arrive 700ms ease-out both;
        }

        h1 {
            margin: 0 0 22px;
            color: var(--muted);
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.08em;
        }

        figure {
            margin: 0;
            padding: 8px;
            border: 1px solid var(--line);
            background: #f6fbfa;
        }

        figure img {
            display: block;
            width: 100%;
            max-height: 440px;
            object-fit: contain;
        }

        blockquote {
            max-width: 460px;
            margin: 30px auto 0;
            font-size: clamp(21px, 5vw, 28px);
            line-height: 1.55;
            text-wrap: pretty;
        }

        @keyframes arrive {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="opening" id="opening">
            <button class="envelope" id="openLetter" type="button" aria-expanded="false" aria-controls="letter">
                <span class="envelope-back" aria-hidden="true"></span>
                <span class="envelope-paper" aria-hidden="true">Para Gabi</span>
                <span class="envelope-front" aria-hidden="true"></span>
                <span class="envelope-flap" aria-hidden="true"></span>
                <span class="envelope-label">Toca para abrir</span>
            </button>
        </div>
        <article class="letter" id="letter" aria-labelledby="letterTitle" hidden>
            <h1 id="letterTitle" tabindex="-1">Us (nosotres)</h1>
            <figure>
                <img src="foto.jpg" alt="Juntos">
            </figure>
            <blockquote>
                Gabi, mi niña linda. La discusión de esta madrugada no significa nada. Yo la quiero mucho, ¿sabe?
            </blockquote>
        </article>
    </main>
    <script>
        const openLetter = document.getElementById('openLetter');
        const opening = document.getElementById('opening');
        const letter = document.getElementById('letter');
        const letterTitle = document.getElementById('letterTitle');

        openLetter.addEventListener('click', () => {
            openLetter.setAttribute('aria-expanded', 'true');
            opening.classList.add('is-opening');

            const delay = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 700;
            window.setTimeout(() => {
                opening.hidden = true;
                letter.hidden = false;
                letterTitle.focus({ preventScroll: true });
            }, delay);
        });
    </script>
</body>
</html>
